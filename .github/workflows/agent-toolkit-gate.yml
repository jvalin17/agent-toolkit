# Quality gate for agent-toolkit (canonical CI workflow).
# No GitHub secret required: bootstrap creates .gate/signing.key.
# Optional: AGENT_TOOLKIT_GATE_SECRET for a stable key across runs/machines.
# Signed mode + branch protection: require check "agent-toolkit-gate" on main.
#
# Consumer projects get a lighter copy via templates/github/workflows/agent-toolkit-gate.yml

name: agent-toolkit-gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    name: agent-toolkit-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r gate/requirements.txt pytest

      - name: Unit tests (gate + hooks)
        run: |
          python -m pytest tests/ -q
          bash tests/test-hooks.sh

      - name: MCP server smoke test
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"select_agent","arguments":{"task_type":"fetch"}}}
          {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"list_roles","arguments":{}}}
          {"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"list_skills","arguments":{}}}
          {"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"list_agents","arguments":{}}}' \
          | python -m toolkit_mcp \
          | python -c "
          import sys, json
          for line in sys.stdin:
              msg = json.loads(line)
              r = msg.get('result', {})
              if 'serverInfo' in r:
                  assert r['serverInfo']['name'] == 'agent-toolkit', 'bad server name'
              elif 'tools' in r:
                  names = [t['name'] for t in r['tools']]
                  assert len(names) == 8, f'expected 8 tools, got {len(names)}'
              elif 'content' in r:
                  data = json.loads(r['content'][0]['text'])
                  if isinstance(data, dict) and 'model' in data:
                      assert data['model'] == 'haiku', f'fetch should be haiku, got {data[\"model\"]}'
                  elif isinstance(data, list):
                      assert len(data) >= 5, f'expected >=5 items, got {len(data)}'
          print('MCP smoke test passed: 8 tools, protocol ok, routing correct')
          "

      - name: Bootstrap gate layout (idempotent)
        run: bash scripts/bootstrap-project-gates.sh "$(pwd)" "$(pwd)"

      - name: Generate mechanical reports (replaces fake fixtures)
        run: python scripts/ci-generate-reports.py .

      - name: Attest
        run: python .agent-toolkit/gate/scripts/verify_gate.py attest --project-root .
        env:
          AGENT_TOOLKIT_ATTEST_SKIP_HOOK_TESTS: "1"
          AGENT_TOOLKIT_ATTEST_SKIP_GATE_TESTS: "1"

      - name: Issue gate token
        run: python .agent-toolkit/gate/scripts/issue_token.py --project-root . --action push

      - name: Verify gate token
        run: |
          python .agent-toolkit/gate/scripts/verify_gate.py verify \
            --project-root . \
            --action push \
            --commit "${{ github.sha }}"

      - name: Upload gate token artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-token
          path: .gate/gate-token.jwt
          retention-days: 14
