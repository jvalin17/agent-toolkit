# Quality gate for agent-toolkit (canonical CI workflow).
# No GitHub secret required: bootstrap creates the signing key on the runner.
# Optional: AGENT_TOOLKIT_GATE_SECRET for a stable key across runs/machines.
# Signed mode + branch protection: require check "agent-toolkit-gate" on main.
#
# Security model:
#   - Actions are pinned by commit SHA (mutable tags can be moved).
#   - On pull requests the GATE CODE AND POLICY come from the base branch
#     (checked out into base-toolkit/), never from the PR head. A PR cannot
#     weaken gates.json, stub test_command, or edit the verifier and go green.
#   - Repo-supplied test/lint commands must pass gate/command_policy.py.
#
# Consumer projects get a lighter copy via templates/github/workflows/agent-toolkit-gate.yml

name: agent-toolkit-gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    name: agent-toolkit-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # On PRs, the gate itself (scripts, gate/, policy) is taken from the base
      # branch so the PR under review cannot change how it is judged.
      - name: Check out trusted gate (base branch) for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.base_ref }}
          path: base-toolkit

      - name: Select gate source
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "src=$GITHUB_WORKSPACE/base-toolkit" >> "$GITHUB_OUTPUT"
            # Policy comes from the base branch, not the PR head.
            cp base-toolkit/gates.json gates.json
          else
            echo "src=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r "${{ steps.gate.outputs.src }}/gate/requirements.txt" pytest

      - name: Unit tests (gate + hooks)
        run: |
          python -m pytest tests/ -q
          bash tests/test-hooks.sh

      - name: MCP server smoke test
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"select_agent","arguments":{"task_type":"fetch"}}}
          {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"list_roles","arguments":{}}}
          {"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"list_skills","arguments":{}}}
          {"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"list_agents","arguments":{}}}' \
          | python -m toolkit_mcp \
          | python -c "
          import sys, json
          for line in sys.stdin:
              msg = json.loads(line)
              r = msg.get('result', {})
              if 'serverInfo' in r:
                  assert r['serverInfo']['name'] == 'agent-toolkit', 'bad server name'
              elif 'tools' in r:
                  names = [t['name'] for t in r['tools']]
                  required = {
                      'select_agent', 'build_plan', 'list_roles', 'list_skills',
                      'resolve_host', 'get_skill', 'get_module', 'run_function',
                  }
                  missing = required - set(names)
                  assert not missing, f'missing tools: {missing}'
                  assert len(names) >= 15, f'expected >=15 tools, got {len(names)}'
              elif 'content' in r:
                  data = json.loads(r['content'][0]['text'])
                  if isinstance(data, dict) and 'model' in data:
                      assert data['model'] == 'haiku', f'fetch should be haiku, got {data[\"model\"]}'
                  elif isinstance(data, list):
                      assert len(data) >= 5, f'expected >=5 items, got {len(data)}'
          print('MCP smoke test passed: >=15 tools, protocol ok, routing correct')
          "

      - name: Bootstrap gate layout (idempotent, from trusted gate source)
        run: bash "${{ steps.gate.outputs.src }}/scripts/bootstrap-project-gates.sh" "$(pwd)" "${{ steps.gate.outputs.src }}"

      - name: Generate mechanical reports (trusted gate source, project under test)
        run: python "${{ steps.gate.outputs.src }}/scripts/ci-generate-reports.py" .

      - name: Attest
        run: python "${{ steps.gate.outputs.src }}/gate/scripts/verify_gate.py" attest --project-root .
        env:
          AGENT_TOOLKIT_ATTEST_SKIP_HOOK_TESTS: "1"
          AGENT_TOOLKIT_ATTEST_SKIP_GATE_TESTS: "1"

      - name: Issue gate token
        run: python "${{ steps.gate.outputs.src }}/gate/scripts/issue_token.py" --project-root . --action push

      - name: Verify gate token
        run: |
          python "${{ steps.gate.outputs.src }}/gate/scripts/verify_gate.py" verify \
            --project-root . \
            --action push \
            --commit "${{ github.sha }}"

      - name: Upload gate token artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-token
          path: .gate/gate-token.jwt
          retention-days: 14
